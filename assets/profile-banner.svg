<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="title desc">
  <title id="title">Wilgen Rivas — Full-Stack Developer and UI/UX Designer</title>
  <desc id="desc">A midnight-blue banner with cyan typography, a geometric W monogram, and a sound-wave motif inspired by Wilgen's DJ background.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#07121e"/><stop offset="1" stop-color="#10283c"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#77e9ff"/><stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#9fcee5" stroke-opacity=".045"/>
    </pattern>
    <clipPath id="clip"><rect width="1280" height="400" rx="24"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1280" height="400" fill="url(#bg)"/>
    <rect width="1280" height="400" fill="url(#grid)"/>
    <path d="M838 0L724 400M858 0L744 400" stroke="#77e9ff" stroke-opacity=".08"/>
    <circle cx="1035" cy="200" r="175" fill="#38bdf8" fill-opacity=".035"/>
    <circle cx="1035" cy="200" r="140" fill="none" stroke="#77e9ff" stroke-opacity=".13"/>
    <circle cx="1035" cy="200" r="113" fill="none" stroke="#77e9ff" stroke-opacity=".08"/>
    <g font-family="Arial, Helvetica, sans-serif">
      <circle cx="61" cy="61" r="5" fill="#77e9ff"/>
      <text x="79" y="67" fill="#a9c4d5" font-size="18" letter-spacing="3">CODE / DESIGN / RHYTHM</text>
      <text x="56" y="170" fill="#f2f8fc" font-size="72" font-weight="700" letter-spacing="-2">Wilgen Rivas<tspan fill="#77e9ff">.</tspan></text>
      <text x="60" y="218" fill="#77e9ff" font-size="27" font-weight="600">Full-Stack Developer &amp; UI/UX Designer</text>
      <text x="60" y="266" fill="#b7cad8" font-size="23">Turning real-world workflows into useful software.</text>
      <path d="M60 310H720" stroke="#7da4ba" stroke-opacity=".2"/>
      <text x="60" y="351" fill="#a9c4d5" font-size="18" letter-spacing="1.5">BASED IN THE PHILIPPINES</text>
      <text x="589" y="351" fill="#77e9ff" font-size="18" letter-spacing="1.5">@ITSWILGEN</text>
    </g>
    <g fill="none" stroke="url(#accent)" stroke-width="16" stroke-linecap="square" stroke-linejoin="miter">
      <path d="M944 139L981 246L1035 167L1089 246L1126 139"/>
